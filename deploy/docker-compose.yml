services:
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - odoo-db:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    env_file:
      - .env
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWORD:-admin}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./scripts:/mnt/scripts:ro
    restart: unless-stopped

volumes:
  odoo-db:
  odoo-data:
